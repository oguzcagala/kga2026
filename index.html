<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canım Anneme — Karşıyaka Girne Anaokulu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8C%B7%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#fff5f7; --ink:#5a2a3b; --accent:#d4577a; --soft:#f9d6e0; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;text-align:center}
  .school{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-weight:600}
  h1{font-size:32px;margin:4px 0 4px;font-weight:700;line-height:1.15}
  h1 .heart{color:var(--accent)}
  .sub{font-size:15px;color:#7a4a5a;margin-bottom:20px}
  .frame{width:100%;max-width:520px;background:white;border:2px solid var(--soft);border-radius:18px;box-shadow:0 8px 30px rgba(212,87,122,.15);overflow:hidden;padding:14px}
  video{width:100%;border-radius:10px;background:#000;display:block}
  .err{color:#a33;padding:24px}
  .foot{margin-top:18px;font-size:13px;color:#9a6a7a}
  .heart-deco{font-size:22px;margin:14px 0}
</style>
</head>
<body>
  <div class="school">Karşıyaka Girne Anaokulu</div>
  <h1>Canım Anneme <span class="heart">♥</span></h1>
  <div class="sub">Anneler Günün Kutlu Olsun</div>
  <div class="frame">
    <video id="v" controls playsinline preload="metadata"></video>
    <div id="err" class="err" style="display:none">Video bulunamadı.</div>
  </div>
  <div class="heart-deco">🌷 ♥ 🌷</div>
  <div class="foot">Çocuğunuzdan size küçük bir sürpriz</div>
<script>
  var p = new URLSearchParams(location.search);
  var id = (p.get('v') || '').replace(/[^a-zA-Z0-9]/g,'').slice(0,16);
  var v = document.getElementById('v');
  if (!id) {
    document.getElementById('err').style.display = 'block';
    v.style.display = 'none';
  } else {
    v.src = 'videos/' + id + '.mp4';
    v.addEventListener('error', function(){
      document.getElementById('err').style.display = 'block';
      v.style.display = 'none';
    });
  }
</script>
</body>
</html>
